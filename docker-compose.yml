# atlas-corpus
#
# One command to a queryable corpus: docker compose up --build -d
#
# The FastAPI corpus connects to a separately managed private Qdrant service.
# Ollama stays on the host; the container reaches it through
# host.docker.internal.

name: atlas-corpus

services:
  corpus:
    build: .
    restart: unless-stopped
    ports:
      - "8092:8092"
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - EMBED_MODEL=${EMBED_MODEL:-nomic-embed-text}
      - ANSWER_MODEL=${ANSWER_MODEL:-qwen3.5-mtp}
      - ANSWER_PROVIDER=${ANSWER_PROVIDER:-openai}
      - ANSWER_OPENAI_BASE_URL=${ANSWER_OPENAI_BASE_URL:-http://host.docker.internal:8095/v1}
      - ANSWER_OPENAI_MODEL=${ANSWER_OPENAI_MODEL:-qwen3.5-mtp}
      - ANSWER_OPENAI_API_KEY=${ANSWER_OPENAI_API_KEY:-}
      - ANSWER_OPENAI_MAX_TOKENS=${ANSWER_OPENAI_MAX_TOKENS:-140}
      - EMBED_BATCH_SIZE=${EMBED_BATCH_SIZE:-16}
      # 0 keeps the embedder on CPU so it cannot evict the answer
      # model from VRAM. See app/config.py for the measurements.
      - EMBED_NUM_GPU=${EMBED_NUM_GPU:-0}
      - COLLECTION_NAME=${COLLECTION_NAME:-atlas_corpus}
      - VECTOR_BACKEND=${VECTOR_BACKEND:-qdrant}
      - QDRANT_URL=${QDRANT_URL:-https://qdrant:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_CA_CERT=${QDRANT_CA_CERT:-}
      - QDRANT_VERIFY_TLS=${QDRANT_VERIFY_TLS:-true}
      - QDRANT_VECTOR_SIZE=${QDRANT_VECTOR_SIZE:-768}
      - QDRANT_TIMEOUT_SECONDS=${QDRANT_TIMEOUT_SECONDS:-20}
      - GITHUB_OWNER=${GITHUB_OWNER:-AtlasReaper311}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - PUBLIC_CLASSIFICATION_FILE=${PUBLIC_CLASSIFICATION_FILE:-atlas-infra:policy/public-repository-classifications.json}
      - EXCLUDE_REPOS=${EXCLUDE_REPOS:-AtlasReaper311}
      - SITE_REPO=${SITE_REPO:-atlas-systems}
      - CASE_STUDY_PREFIX=${CASE_STUDY_PREFIX:-work/}
      - ARTICLE_PREFIX=${ARTICLE_PREFIX:-writing/}
      - EXTRA_FILES=${EXTRA_FILES:-atlas-infra:docs/decisions.md:decision}
      - DOCS_DIR=${DOCS_DIR:-/srv/docs}
      - CURATED_DOCS=${CURATED_DOCS:-ramone-public-context.md:ramone-public,ramone-public-faq.md:ramone-public,atlas-public-boundaries.md:policy,atlas-public-context.md:portfolio,atlas-public-service-map.md:portfolio,atlas-public-retrieval-map.md:policy,atlas-brand.md:brand,specular-core-public-profile.md:infra-public,atlas-public-estate-map.md:estate-map,atlas-public-runtime-catalog.md:runtime-catalog,atlas-public-ramone-architecture.md:ramone-public,atlas-public-history.md:public-history}
      - CHUNK_WORDS=${CHUNK_WORDS:-512}
      - CHUNK_OVERLAP_WORDS=${CHUNK_OVERLAP_WORDS:-64}
      - TOP_K_DEFAULT=${TOP_K_DEFAULT:-5}
      - TOP_K_MAX=${TOP_K_MAX:-10}
      - QUERY_MAX_CHARS=${QUERY_MAX_CHARS:-500}
      - RATE_LIMIT_PER_HOUR=${RATE_LIMIT_PER_HOUR:-60}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://atlas-systems.uk,https://www.atlas-systems.uk,http://localhost:8788}
      - REFRESH_INTERVAL_SECONDS=${REFRESH_INTERVAL_SECONDS:-0}
      - STARTUP_REFRESH_DELAY_SECONDS=${STARTUP_REFRESH_DELAY_SECONDS:--1}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - QUERY_LOG_PATH=${QUERY_LOG_PATH:-/srv/data/queries.db}
      - RAG_REPORT_URL=${RAG_REPORT_URL:-https://api.atlas-systems.uk/v1/rag/report}
      - RAG_REPORT_KEY=${RAG_REPORT_KEY:-}
      - RAG_SUMMARY_INTERVAL_SECONDS=${RAG_SUMMARY_INTERVAL_SECONDS:-3600}
      - CORPUS_SECRET=${CORPUS_SECRET:?CORPUS_SECRET must be set; generate with `python -c "import secrets; print(secrets.token_urlsafe(48))"`}
    volumes:
      - corpus-data:/srv/data
      - ./docs:/srv/docs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  corpus-data:
