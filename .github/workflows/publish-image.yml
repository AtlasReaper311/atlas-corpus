# Calls atlas-infra's reusable GHCR publish workflow for this repo.
# Builds automatically on every push to main, same trigger ci.yml
# already uses. This only publishes an image artifact to
# ghcr.io/atlasreaper311/atlas-corpus, it never touches the running
# service on SPECULAR-CORE. Pulling the new image there stays a
# separate, deliberate step.

name: Publish Container Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # REPLACE this draft PR SHA with atlas-infra's main commit SHA once the
    # atlas-infra PR adding publish-container-image.yml is merged. Same
    # pin-to-immutable-commit convention refresh-corpus.yml already uses for
    # cross-repo reusable workflow calls.
    uses: AtlasReaper311/atlas-infra/.github/workflows/publish-container-image.yml@342a8edce9d7c7a4a8992256c46c06425edcc5b4 # atlas-infra draft PR head
    permissions:
      contents: read
      packages: write
    with:
      image_name: atlas-corpus
